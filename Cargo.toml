[package]
name = "superoxide-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
dotenvy = "0.15"
tracing = "0.1"
chrono = "0.4"
colored = "3"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "macros", "tls-rustls"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
thiserror = "2.0.18"
serde = "1.0.228"
